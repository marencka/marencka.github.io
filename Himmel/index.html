<h1>Himmel</h1>
<p class="mut">Know how good the sky will be, before it happens.</p>
<p>Himmel forecasts the color of the next sunrise and sunset where you are, and shows it on your Home Screen, in widgets and in a notification when it's worth looking up.</p>
